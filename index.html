<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171c19" />
    <meta name="description" content="Room schedules at ETH Zürich. See scheduled bookings and unbooked time at a glance." />
    <title>Study Rooms · ETH Zürich</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">ETH Zürich</p>
          <h1>Study Rooms</h1>
          <nav class="date-nav" aria-label="Schedule date">
            <button id="previous-day" class="icon-button" type="button" aria-label="Previous day" title="Previous day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg></button>
            <p id="today-date" class="date" aria-live="polite"></p>
            <button id="next-day" class="icon-button" type="button" aria-label="Next day" title="Next day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6" /></svg></button>
          </nav>
        </div>
      </header>

      <section aria-label="Room schedules">
        <div class="table-meta">
          <div class="legend" aria-label="Timetable legend">
            <span><i class="swatch unbooked" aria-hidden="true"></i>Free</span>
            <span><i class="swatch booked" aria-hidden="true"></i>Booked</span>
          </div>
        </div>
        <div id="board-scroll" class="board-scroll" tabindex="0" role="region" aria-label="Room timetable">
          <table id="timetable">
            <caption class="sr-only">Room schedules, from 08:00 to 20:00, Europe/Zurich. Activate a booked segment for details.</caption>
            <colgroup><col class="room-column" /><col /></colgroup>
            <thead><tr><th class="corner" scope="col">Room</th><th scope="col"><div id="time-axis" class="time-axis"></div><span class="sr-only">Schedule</span></th></tr></thead>
            <tbody id="room-rows"></tbody>
          </table>
        </div>
        <div class="schedule-footer">
          <p id="load-status" role="status" aria-live="polite"></p>
          <p id="updated" class="updated">Not updated yet</p>
        </div>
      </section>
    </main>
    <div id="booking-popover" class="booking-popover" popover="auto" role="region" aria-label="Booking details">
      <div class="popover-heading"><p id="popover-room"></p><button id="close-popover" type="button" aria-label="Close booking details">×</button></div>
      <div id="popover-content"></div>
    </div>
    <noscript><p class="noscript">JavaScript is needed to load room schedules.</p></noscript>
  </body>
</html>
